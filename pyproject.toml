[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asterdex-mcp"
version = "0.1.0"
description = "Model Context Protocol server for Aster DEX"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "kairos-aster-sdk @ file:///tmp/kairos-aster-sdk",
]

[project.scripts]
asterdex-mcp = "asterdex_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/asterdex_mcp"]

[tool.hatch.metadata]
allow-direct-references = true
