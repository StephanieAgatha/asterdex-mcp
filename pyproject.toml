[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asterdex-mcp"
version = "0.2.3"
description = "Model Context Protocol server for Aster DEX — trade, analyze, and manage positions on Aster DEX via MCP"
readme = "README.md"
requires-python = ">=3.11"
classifiers = ["License :: OSI Approved :: MIT License"]
license-files = []
dependencies = [
    "mcp>=1.0.0",
    "numpy>=1.24",
    "eth-account>=0.10.0",
    "eth-abi>=5.0.0",
    "eth-utils>=2.0.0",
    "requests>=2.28.0",
    "websockets>=12.0",
]

[project.scripts]
asterdex-mcp = "asterdex_mcp.server:main"

[tool.hatch.build.targets.sdist]
include = ["src/asterdex_mcp/"]

[tool.hatch.build.targets.wheel]
packages = ["src/asterdex_mcp"]
